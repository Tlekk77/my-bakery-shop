<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านขนมออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 min-h-screen p-5 flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border-t-8 border-orange-500">
        <h1 class="text-3xl font-bold text-orange-600 mb-6 text-center">🍪 สั่งขนมออนไลน์</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-700">ชื่อลูกค้า:</label>
                <input type="text" id="name" class="w-full border-2 p-3 rounded-xl focus:border-orange-400 outline-none" placeholder="ระบุชื่อของคุณ">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700">เลือกเมนูขนม:</label>
                <select id="order" class="w-full border-2 p-3 rounded-xl">
                    <option value="บราวนี่หนึบ (50.-)">บราวนี่หนึบ (50.-)</option>
                    <option value="เค้กไข่ไต้หวัน (120.-)">เค้กไข่ไต้หวัน (120.-)</option>
                    <option value="คุ๊กกี้เนยสด (180.-)">คุ๊กกี้เนยสด (180.-)</option>
                </select>
            </div>

            <div class="bg-gray-100 p-4 rounded-xl text-center border-2 border-dashed border-gray-300">
                <p class="text-xs text-gray-500 mb-2">สแกนจ่ายที่นี่ (QR Code ของคุณ)</p>
                <img src="https://scontent.fbkk25-1.fna.fbcdn.net/v/t1.15752-9/621442580_1098768079013655_3719796804853129544_n.jpg?_nc_cat=104&ccb=1-7&_nc_sid=9f807c&_nc_ohc=xcnjXQhlweIQ7kNvwFwgirs&_nc_oc=AdlD2LiBhQskafsh8tuH12W0GP8mShIeKOUEZE_3xAUQPHt05jdh_E1GrzPdooweLba0fr5hK8nCZJMpUU1gyQqw&_nc_zt=23&_nc_ht=scontent.fbkk25-1.fna&oh=03_Q7cD4gHlNwgoWfaxwTQMi-X6qVi-MUrDnINnA8k_X5jv_8uGTQ&oe=69AC3B8F" class="w-48 h-48 mx-auto rounded-lg shadow-md border-2 border-white">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700">แนบสลิปโอนเงิน:</label>
                <input type="file" id="slip" accept="image/*" class="w-full text-sm mt-1">
            </div>

            <button onclick="sendOrder()" id="btn" class="w-full bg-orange-500 text-white py-4 rounded-xl font-bold text-lg hover:bg-orange-600 shadow-lg">
                ยืนยันการสั่งซื้อ
            </button>
        </div>
    </div>

    <script>
        async function sendOrder() {
            const btn = document.getElementById('btn');
            const fileInput = document.getElementById('slip');
            const name = document.getElementById('name').value;
            const order = document.getElementById('order').value;
            
            if(!name || !fileInput.files[0]) return alert("กรุณากรอกข้อมูลและแนบสลิปครับ");

            btn.disabled = true;
            btn.innerText = "กำลังประมวลผล...";

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.readAsDataURL(file);
            
            reader.onload = async function() {
                const base64Data = reader.result;
                
                // *** ใส่ URL เว็บแอปของคุณที่ได้จากขั้นตอนที่ 1 ลงตรงนี้ ***
                const scriptURL = 'ใhttps://script.google.com/macros/s/AKfycbxB9FEYjmUJEaBWoAdEqsD0fY8WUV4TI3BidzVkIF8Z2vu4elRm18wf_fJVle5bmpRoUg/exec';

                const formData = new URLSearchParams();
                formData.append('name', name);
                formData.append('order', order);
                formData.append('price', order.match(/\d+/)[0]);
                formData.append('file', base64Data);
                formData.append('filename', file.name);

                try {
                    // ส่งข้อมูลแบบปกติเพื่อให้รอรับรหัสตอบกลับ (CORS อาจติดได้ในบางครั้ง)
                    // ถ้าติดปัญหา CORS ให้เปลี่ยนเป็นส่งแบบ no-cors แต่จะไม่เห็นรหัสรับของ
                    const response = await fetch(scriptURL, { method: 'POST', body: formData });
                    const code = await response.text(); 

                    alert("✨ สั่งซื้อสำเร็จ! ✨\n\nรหัสรับสินค้าของคุณคือ: " + code + "\n\nกรุณาแคปหน้าจอเก็บไว้เพื่อใช้รับของครับ");
                    location.reload();
                } catch (e) {
                    alert("ส่งข้อมูลสำเร็จ! ระบบกำลังแจ้งเตือนร้านค้า (หากรหัสไม่ขึ้น ให้รอแจ้งเตือนจากทางร้านครับ)");
                    location.reload();
                }
            };
        }
    </script>
</body>
</html>
