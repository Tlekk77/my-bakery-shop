<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สั่งซื้อขนมออนไลน์</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fcf8f3; font-family: 'Kanit', sans-serif; padding-top: 30px; }
        .order-card { border-radius: 20px; border: none; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .btn-confirm { background-color: #d4a373; color: white; border: none; }
        .btn-confirm:hover { background-color: #bc8a5f; color: white; }
        .qr-section { background: #fff; border: 1px dashed #ccc; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container" style="max-width: 500px;">
    <div class="card order-card p-4">
        <h3 class="text-center mb-4">🍩 สั่งซื้อขนม</h3>
        
        <div class="mb-3">
            <label class="form-label">ชื่อของคุณ</label>
            <input type="text" id="customerName" class="form-control" placeholder="กรุณาใส่ชื่อ">
        </div>

        <div class="mb-3">
            <label class="form-label">เลือกขนม</label>
            <select id="productList" class="form-select">
                <option value="เค้กวานิลลา (80 บาท)">เค้กวานิลลา - 80.-</option>
                <option value="มาการอง (150 บาท)">มาการอง - 150.-</option>
                <option value="ครัวซองต์ (65 บาท)">ครัวซองต์ - 65.-</option>
            </select>
        </div>

        <div class="qr-section text-center mb-3">
            <p class="mb-2"><b>สแกนจ่ายเงินที่นี่</b></p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=YOUR_PROMPTPAY_ID" id="qrImage" class="img-fluid mb-2" alt="PromptPay QR">
            <p class="text-muted small">กรุณาโอนเงินให้เรียบร้อยก่อนแนบสลิป</p>
        </div>

        <div class="mb-4">
            <label class="form-label">แนบสลิปการโอนเงิน</label>
            <input type="file" id="slipFile" class="form-control" accept="image/*">
        </div>

        <button onclick="sendOrder()" id="btnSubmit" class="btn btn-confirm w-100 py-2">ยืนยันการสั่งซื้อ</button>
        
        <div id="loading" class="text-center mt-3" style="display:none;">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="mt-2">กำลังบันทึกข้อมูล...</p>
        </div>
        
        <div id="successMsg" class="mt-3" style="display:none;"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "ใส่_URL_แอปเว็บ_จาก_Google_Apps_Script_ที่นี่";

    async function sendOrder() {
        const name = document.getElementById('customerName').value;
        const product = document.getElementById('productList').value;
        const fileInput = document.getElementById('slipFile');
        const btn = document.getElementById('btnSubmit');
        const loading = document.getElementById('loading');
        
        if (!name || !fileInput.files[0]) {
            alert("กรุณากรอกข้อมูลและแนบสลิปให้ครบถ้วน");
            return;
        }

        btn.disabled = true;
        loading.style.display = 'block';

        const reader = new FileReader();
        reader.readAsDataURL(fileInput.files[0]);
        reader.onload = async () => {
            const base64 = reader.result;
            const data = {
                customerName: name,
                productList: product,
                totalPrice: product.match(/\d+/)[0],
                slipBase64: base64
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                if (result.result === "success") {
                    document.querySelector('.card').innerHTML = `
                        <div class="text-center p-4">
                            <h4 class="text-success">สั่งซื้อสำเร็จ!</h4>
                            <p>รหัสรับสินค้าของคุณคือ:</p>
                            <h2 class="display-4 font-monospace"><b>${result.orderId}</b></h2>
                            <p class="text-muted small">กรุณาแจ้งรหัสนี้ให้พนักงานทราบ</p>
                            <button class="btn btn-outline-secondary mt-3" onclick="location.reload()">สั่งใหม่</button>
                        </div>`;
                }
            } catch (error) {
                alert("เกิดข้อผิดพลาด: " + error);
                btn.disabled = false;
                loading.style.display = 'none';
            }
        };
    }
</script>

</body>
</html>
