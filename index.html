<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery Order System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #fff9f0; font-family: 'Kanit', sans-serif; padding: 20px; }
        .order-card { border-radius: 25px; border: none; box-shadow: 0 15px 35px rgba(0,0,0,0.1); background: white; }
        .qr-box { background: #f8f9fa; padding: 20px; border-radius: 20px; border: 2px dashed #d4a373; margin-bottom: 20px; }
        .btn-send { background: #d4a373; color: white; border: none; font-weight: 600; padding: 12px; border-radius: 12px; }
        .btn-send:hover { background: #bc8a5f; color: white; }
    </style>
</head>
<body>

<div class="container" style="max-width: 480px;">
    <div class="card order-card p-4">
        <h2 class="text-center mb-4" style="color: #d4a373;">🥖 สั่งซื้อขนม</h2>
        
        <div class="mb-3">
            <label class="form-label">ชื่อ-นามสกุล</label>
            <input type="text" id="customerName" class="form-control" placeholder="กรอกชื่อของคุณ">
        </div>

        <div class="mb-3">
            <label class="form-label">เลือกเมนูขนม</label>
            <select id="productList" class="form-select">
                <option value="" disabled selected>-- เลือกขนมที่ต้องการ --</option>
                <option value="ครัวซองต์เนยสด (65 บาท)">ครัวซองต์เนยสด - 65.-</option>
                <option value="เค้กช็อกโกแลต (120 บาท)">เค้กช็อกโกแลต - 120.-</option>
                <option value="คุ้กกี้รวมรส (95 บาท)">คุ้กกี้รวมรส - 95.-</option>
            </select>
        </div>

        <div class="qr-box text-center">
            <p class="mb-2"><b>💰 สแกนชำระเงินที่นี่</b></p>
            <img src="https://scontent.fbkk25-1.fna.fbcdn.net/v/t1.15752-9/621442580_1098768079013655_3719796804853129544_n.jpg?_nc_cat=104&ccb=1-7&_nc_sid=9f807c&_nc_ohc=xcnjXQhlweIQ7kNvwFwgirs&_nc_oc=AdlD2LiBhQskafsh8tuH12W0GP8mShIeKOUEZE_3xAUQPHt05jdh_E1GrzPdooweLba0fr5hK8nCZJMpUU1gyQqw&_nc_zt=23&_nc_ht=scontent.fbkk25-1.fna&oh=03_Q7cD4gHlNwgoWfaxwTQMi-X6qVi-MUrDnINnA8k_X5jv_8uGTQ&oe=69AC3B8F" style="max-width: 220px; border-radius: 10px;">
            <div class="mt-3 h5">ยอดโอน: <span id="displayPrice" class="text-primary">0</span> บาท</div>
        </div>

        <div class="mb-4">
            <label class="form-label">แนบสลิปโอนเงิน</label>
            <input type="file" id="slipFile" class="form-control" accept="image/*">
        </div>

        <button onclick="sendOrder()" id="btnSubmit" class="btn btn-send w-100">ยืนยันการสั่งซื้อ</button>
        <div id="loading" class="text-center mt-3" style="display:none;">⏳ กำลังส่งข้อมูล...</div>
    </div>
</div>

<script>
    // URL ที่ได้จากการ Deploy Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAWT2urdb_deGh6ezPOv43TsjAS7SOnb1FU6ux2wzNXqUBn7RYhV3sHOqlS5gb1SBpzQ/exec";

    document.getElementById('productList').addEventListener('change', function() {
        const price = this.value.match(/\d+/);
        document.getElementById('displayPrice').innerText = price ? price[0] : 0;
    });

    async function sendOrder() {
        const name = document.getElementById('customerName').value;
        const product = document.getElementById('productList').value;
        const fileInput = document.getElementById('slipFile');
        const btn = document.getElementById('btnSubmit');

        if (!name || !product || !fileInput.files[0]) {
            alert("กรุณากรอกข้อมูลและแนบสลิปให้ครบถ้วนค่ะ");
            return;
        }

        btn.disabled = true;
        document.getElementById('loading').style.display = 'block';

        const reader = new FileReader();
        reader.readAsDataURL(fileInput.files[0]);
        reader.onload = async () => {
            const data = {
                customerName: name,
                productList: product,
                totalPrice: product.match(/\d+/)[0],
                slipBase64: reader.result
            };

            try {
                const response = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(data) });
                const res = await response.json();
                if (res.result === "success") {
                    alert("บันทึกออเดอร์แล้ว! รหัสของคุณคือ: " + res.orderId);
                    location.reload();
                }
            } catch (e) {
                alert("เกิดข้อผิดพลาด กรุณาลองใหม่นะคะ");
                btn.disabled = false;
                document.getElementById('loading').style.display = 'none';
            }
        };
    }
</script>
</body>
</html>
