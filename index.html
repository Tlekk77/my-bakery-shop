<!DOCTYPE html>
<html>
<head>
    <title>Bakery Order</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .card { border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container mt-3" style="max-width: 500px;">
        <div class="card p-4">
            <h2 class="text-center mb-4">🍩 ร้านขนมของฉัน</h2>
            
            <label class="form-label">เลือกขนม:</label>
            <select id="product" class="form-select mb-3">
                <option value="เค้กช็อกโกแลต (120 บาท)">เค้กช็อกโกแลต - 120.-</option>
                <option value="คุ้กกี้เนย (50 บาท)">คุ้กกี้เนย - 50.-</option>
                <option value="บราวนี่ (85 บาท)">บราวนี่ - 85.-</option>
            </select>

            <input type="text" id="name" class="form-control mb-3" placeholder="ชื่อของคุณ">
            
            <label class="form-label">แนบสลิปโอนเงิน:</label>
            <input type="file" id="slip" class="form-control mb-4" accept="image/*">

            <button onclick="submitOrder()" id="btnSubmit" class="btn btn-primary w-100">สั่งซื้อเลย</button>
            
            <div id="status" class="mt-3 text-center"></div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyFV4aiMMjgJdKtON_tX-HXInJQD09RCpNr_qAq7yIyqpupR_OYEbKUtxpX-Hj057J0zA/exec";

        async function submitOrder() {
            const btn = document.getElementById("btnSubmit");
            const status = document.getElementById("status");
            const fileInput = document.getElementById("slip");
            
            if(!fileInput.files[0]) return alert("กรุณาแนบสลิปด้วยครับ");
            
            btn.disabled = true;
            status.innerHTML = "กำลังประมวลผล...";

            // แปลงรูปเป็น Base64
            const reader = new FileReader();
            reader.readAsDataURL(fileInput.files[0]);
            reader.onload = async () => {
                const base64 = reader.result;
                const data = {
                    customerName: document.getElementById("name").value,
                    productList: document.getElementById("product").value,
                    totalPrice: document.getElementById("product").value.match(/\d+/)[0],
                    slipBase64: base64
                };

                try {
                    const response = await fetch(WEB_APP_URL, {
                        method: "POST",
                        body: JSON.stringify(data)
                    });
                    const res = await response.json();
                    if(res.result === "success") {
                        status.innerHTML = `<div class='alert alert-success'>สำเร็จ! รหัสออเดอร์ของคุณคือ <b>${res.orderId}</b></div>`;
                    }
                } catch (e) {
                    status.innerHTML = "เกิดข้อผิดพลาด กรุณาลองใหม่";
                    btn.disabled = false;
                }
            };
        }
    </script>
</body>
</html>
