<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านเมล็ดกาแฟ</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 min-h-screen p-5 flex items-center justify-center font-sans">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 border-t-8 border-orange-500">
        <h1 class="text-3xl font-black text-orange-600 mb-6 text-center">🍪 สั่งเมล็ดกาแฟร้านเรา</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">ชื่อลูกค้า:</label>
                <input type="text" id="name" class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-orange-400 outline-none" placeholder="ใส่ชื่อของคุณ">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">เมนูความอร่อย:</label>
                <select id="order" class="w-full border-2 border-gray-100 p-3 rounded-xl">
                    <option value="เมล็ดส้ม (50.-)">เมล็ดส้ม (50-1pc.-)</option>
                    <option value="เมล็ดขาวบดผง (120.-)">เมล็ดขาวบดผง (120-10g.-)</option>
                    <option value="ใบกาแฟ (90.-)">ใบกาแฟ (90-20g)</option>
                </select>
            </div>

            <div class="bg-gray-50 p-4 rounded-2xl text-center border-2 border-dashed border-gray-200">
                <p class="text-xs text-gray-400 mb-2">สแกนจ่ายที่นี่ (QR Code ของคุณ)</p>
                <img src="https://scontent.fbkk25-1.fna.fbcdn.net/v/t1.15752-9/621442580_1098768079013655_3719796804853129544_n.jpg?_nc_cat=104&ccb=1-7&_nc_sid=9f807c&_nc_ohc=xcnjXQhlweIQ7kNvwFwgirs&_nc_oc=AdlD2LiBhQskafsh8tuH12W0GP8mShIeKOUEZE_3xAUQPHt05jdh_E1GrzPdooweLba0fr5hK8nCZJMpUU1gyQqw&_nc_zt=23&_nc_ht=scontent.fbkk25-1.fna&oh=03_Q7cD4gHlNwgoWfaxwTQMi-X6qVi-MUrDnINnA8k_X5jv_8uGTQ&oe=69AC3B8F">

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">แนบสลิปโอนเงิน:</label>
                <input type="file" id="slip" accept="image/*" class="w-full text-sm">
            </div>

            <button onclick="sendOrder()" id="btn" class="w-full bg-orange-500 text-white py-4 rounded-2xl font-black text-xl hover:bg-orange-600 shadow-lg transform transition active:scale-95">
                ยืนยันการสั่งซื้อ
            </button>
        </div>
    </div>

    <script>
        async function sendOrder() {
            const btn = document.getElementById('btn');
            const fileInput = document.getElementById('slip');
            const name = document.getElementById('name').value;
            const order = document.getElementById('order').value;
            
            if(!name || !fileInput.files[0]) return alert("กรุณากรอกข้อมูลและแนบสลิปด้วยนะจ๊ะ");

            btn.disabled = true;
            btn.innerText = "กำลังสร้างรหัสรับของ...";

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.readAsDataURL(file);
            
            reader.onload = async function() {
                const base64Data = reader.result;
                
                // *** ใส่ URL สีฟ้าจากรูป image_2111b7.png ของคุณตรงนี้ ***
                const scriptURL = 'https://script.google.com/macros/s/AKfycbxdTNhQ3F2HRG2TYNHKyeFwmAWSpPfi3RoghVg9bvywOX0CdZLaHf4AdhpgQe1UBohG1Q/exec';

                const formData = new URLSearchParams();
                formData.append('name', name);
                formData.append('order', order);
                formData.append('price', order.match(/\d+/)[0]);
                formData.append('file', base64Data);
                formData.append('filename', file.name);

                try {
                    // ส่งข้อมูลและรอรับรหัสตอบกลับ
                    const response = await fetch(scriptURL, { method: 'POST', body: formData });
                    const orderCode = await response.text(); 

                    alert("✨ สั่งซื้อสำเร็จ! ✨\n\nรหัสรับสินค้าของคุณคือ: " + orderCode + "\n\nกรุณาแคปหน้าจอเก็บไว้\nเพื่อใช้รับขนมที่ร้านนะคะ!");
                    location.reload();
                } catch (e) {
                    // กรณีระบบ Google ไม่ให้ข้าม CORS แต่ออเดอร์ส่งสำเร็จแล้ว
                    alert("ส่งออเดอร์เรียบร้อย! กรุณารอรหัสยืนยันจากทางร้านทาง Telegram นะคะ");
                    location.reload();
                }
            };
        }
    </script>
</body>
</html>
