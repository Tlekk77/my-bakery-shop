<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้านขนมออนไลน์</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 min-h-screen p-5 flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 border-4 border-pink-200">
        <h1 class="text-3xl font-bold text-pink-600 mb-6 text-center">🍪 สั่งขนมร้านเรา</h1>
        
        <div class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">ชื่อลูกค้า:</label>
                <input type="text" id="name" class="w-full border-2 border-pink-100 p-3 rounded-xl focus:outline-none focus:border-pink-400">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">เลือกความอร่อย:</label>
                <select id="order" class="w-full border-2 border-pink-100 p-3 rounded-xl">
                    <option value="บราวนี่หนึบ (50.-)">บราวนี่หนึบ (50.-)</option>
                    <option value="เค้กไข่ไต้หวัน (120.-)">เค้กไข่ไต้หวัน (120.-)</option>
                    <option value="คุ๊กกี้เนยสด (180.-)">คุ๊กกี้เนยสด (180.-)</option>
                </select>
            </div>

            <div class="bg-pink-100 p-4 rounded-2xl text-center border-2 border-dashed border-pink-300">
                <p class="text-sm font-bold text-pink-800">โอนเงินเข้าเบอร์: 08x-xxx-xxxx</p>
                <p class="text-xs text-pink-600">กรุณาแนบสลิปด้านล่าง</p>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">แนบสลิปโอนเงิน:</label>
                <input type="file" id="slip" accept="image/*" class="w-full text-sm">
            </div>

            <button onclick="sendOrder()" id="btn" class="w-full bg-pink-500 text-white py-4 rounded-2xl font-black text-xl hover:bg-pink-600 transform transition active:scale-95 shadow-lg">
                ยืนยันการสั่งซื้อ
            </button>
        </div>
    </div>

    <script>
        async function sendOrder() {
            const btn = document.getElementById('btn');
            const fileInput = document.getElementById('slip');
            const name = document.getElementById('name').value;
            const order = document.getElementById('order').value;
            
            if(!name || !fileInput.files[0]) return alert("กรุณาใส่ชื่อและแนบสลิปด้วยนะคะ");

            btn.disabled = true;
            btn.innerText = "กำลังสร้างรหัสรับของ...";

            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.readAsDataURL(file);
            
            reader.onload = async function() {
                const base64Data = reader.result;
                // *** ใส่ URL ของคุณตรงนี้ ***
                const url = 'https://script.google.com/macros/s/AKfycbwgZGaPIvXbMoEoNDiTHNgKOfVyBUKIfhZF-qS9CZS2HKyIfsx4EBJzbViTZfz0YpY5fg/exec'; 

                const formData = new URLSearchParams();
                formData.append('name', name);
                formData.append('order', order);
                formData.append('price', order.match(/\d+/)[0]);
                formData.append('file', base64Data);
                formData.append('filename', file.name);

                try {
                    const response = await fetch(url, { method: 'POST', body: formData, mode: 'no-cors' });
                    
                    // เนื่องจาก mode no-cors จะอ่าน response ไม่ได้ 
                    // เราจะแสดงข้อความให้ลูกค้ารอสักครู่ (หรือเปลี่ยน mode ถ้ามีพื้นฐาน)
                    alert("✨ สั่งซื้อสำเร็จ! ✨\n\nระบบได้รับออเดอร์แล้ว\nรหัสรับสินค้าจะถูกส่งเข้า Telegram ร้าน\nขอบคุณที่อุดหนุนค่ะ!");
                    location.reload();
                } catch (e) {
                    alert("เกิดข้อผิดพลาด ลองใหม่อีกครั้ง");
                    btn.disabled = false;
                }
            };
        }
    </script>
</body>
</html>
