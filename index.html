<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pool Long Aim Line</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: rgba(13, 17, 23, 0.6);
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 20px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-reset {
            background: #da3633;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        input[type=range] {
            width: 80px;
        }
    </style>
</head>
<body>

<div id="container">
    <canvas id="aimCanvas"></canvas>
    
    <div class="controls">
        <button class="btn btn-reset" onclick="resetPoints()">รีเซ็ตจุด</button>
        <div class="slider-group">
            <label>ความใส:</label>
            <input type="range" id="opacitySlider" min="0.2" max="1" step="0.05" value="0.85">
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('aimCanvas');
    const ctx = canvas.getContext('2d');
    const opacitySlider = document.getElementById('opacitySlider');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        draw();
    });

    // พิกัดจุด 3 จุด (ขาว = ลูกขาว, แดง = ลูกเป้า, เหลือง = หลุม)
    let points = {
        cue: { x: width * 0.3, y: height * 0.5, radius: 18, color: '#ffffff', label: 'ลูกขาว' },
        target: { x: width * 0.6, y: height * 0.4, radius: 18, color: '#ff4d4d', label: 'ลูกเป้า' },
        pocket: { x: width * 0.85, y: height * 0.2, radius: 15, color: '#ffcc00', label: 'หลุม' }
    };

    let activePoint = null;

    function getTouchPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function isInside(pos, pt) {
        return Math.hypot(pos.x - pt.x, pos.y - pt.y) < pt.radius + 15;
    }

    function onStart(e) {
        const pos = getTouchPos(e);
        for (let key in points) {
            if (isInside(pos, points[key])) {
                activePoint = key;
                break;
            }
        }
    }

    function onMove(e) {
        if (!activePoint) return;
        const pos = getTouchPos(e);
        points[activePoint].x = pos.x;
        points[activePoint].y = pos.y;
        draw();
    }

    function onEnd() {
        activePoint = null;
    }

    canvas.addEventListener('mousedown', onStart);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onEnd);
    canvas.addEventListener('touchstart', onStart);
    canvas.addEventListener('touchmove', onMove);
    canvas.addEventListener('touchend', onEnd);

    opacitySlider.addEventListener('input', draw);

    function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.globalAlpha = parseFloat(opacitySlider.value);

        const { cue, target, pocket } = points;

        // 1. คำนวณ Ghost Ball (จุดที่ลูกขาวต้องชนลูกเป้าเพื่อให้ลูกเป้าวิ่งไปหาหลุม)
        const angleTargetToPocket = Math.atan2(pocket.y - target.y, pocket.x - target.x);
        const ballRadius = 16; // รัศมีลูกพูลจำลอง
        
        // ghost ball จะอยู่ฝั่งตรงข้ามกับหลุม ห่างจากลูกเป้าเท่ากับ 2 เท่าของรัศมี
        const ghostX = target.x - Math.cos(angleTargetToPocket) * (ballRadius * 2);
        const ghostY = target.y - Math.sin(angleTargetToPocket) * (ballRadius * 2);

        // 2. วาดเส้นเล็งจากลูกขาว -> Ghost Ball (เส้นแทงลูกขาว)
        ctx.beginPath();
        ctx.moveTo(cue.x, cue.y);
        ctx.lineTo(ghostX, ghostY);
        ctx.strokeStyle = '#00f2fe';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 6]);
        ctx.stroke();

        // 3. วาดเส้นยาวต่อจากลูกเป้า -> ทะลุหลุมออกไปสุดหน้าจอ (Aim Line ยาว)
        const longDist = 2000; // ลากยาวทะลุหน้าจอ
        const lineEndX = target.x + Math.cos(angleTargetToPocket) * longDist;
        const lineEndY = target.y + Math.sin(angleTargetToPocket) * longDist;

        ctx.beginPath();
        ctx.moveTo(target.x, target.y);
        ctx.lineTo(lineEndX, lineEndY);
        ctx.strokeStyle = '#39ff14'; // สีเขียวสะท้อนแสง
        ctx.lineWidth = 4;
        ctx.setLineDash([]);
        ctx.stroke();

        // 4. วาด Ghost Ball เสมือน
        ctx.beginPath();
        ctx.arc(ghostX, ghostY, ballRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = 2;
        ctx.setLineDash([3, 3]);
        ctx.stroke();

        // 5. วาดจุดควบคุมทั้ง 3 จุด
        for (let key in points) {
            const pt = points[key];
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
            ctx.fillStyle = pt.color;
            ctx.shadowColor = pt.color;
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.shadowBlur = 0;

            // ป้ายชื่อจุด
            ctx.fillStyle = '#ffffff';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(pt.label, pt.x, pt.y - pt.radius - 6);
        }
    }

    function resetPoints() {
        points.cue = { x: width * 0.3, y: height * 0.5, radius: 18, color: '#ffffff', label: 'ลูกขาว' };
        points.target = { x: width * 0.6, y: height * 0.4, radius: 18, color: '#ff4d4d', label: 'ลูกเป้า' };
        points.pocket = { x: width * 0.85, y: height * 0.2, radius: 15, color: '#ffcc00', label: 'หลุม' };
        draw();
    }

    draw();
</script>
</body>
</html>
