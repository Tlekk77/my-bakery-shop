<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pool Aim Line Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: transparent;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: fixed;
            touch-action: none;
        }
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(22, 27, 34, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 12px 22px;
            border-radius: 35px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }
        .btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-reset {
            background: #da3633;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #fff;
        }
        input[type=range] {
            width: 80px;
        }
    </style>
</head>
<body>

<div id="container">
    <canvas id="aimCanvas"></canvas>
    
    <div class="controls">
        <button class="btn btn-reset" onclick="resetPoints()">รีเซ็ต</button>
        <div class="slider-group">
            <label>ความใส:</label>
            <input type="range" id="opacitySlider" min="0.2" max="1" step="0.05" value="0.9">
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('aimCanvas');
    const ctx = canvas.getContext('2d');
    const opacitySlider = document.getElementById('opacitySlider');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        draw();
    });

    let points = {
        cue: { x: width * 0.3, y: height * 0.6, radius: 35, color: '#ffffff', label: 'ลูกขาว' },
        target: { x: width * 0.6, y: height * 0.4, radius: 35, color: '#ff4d4d', label: 'ลูกเป้า' },
        pocket: { x: width * 0.85, y: height * 0.2, radius: 35, color: '#ffcc00', label: 'หลุม' }
    };

    let activePoint = null;

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function onStart(e) {
        const pos = getPos(e);
        // เช็คว่านิ้วแตะโดนจุดไหน (ขยายโซนสัมผัสให้กว้างขึ้นมากๆ เพื่อให้กดติดง่าย)
        for (let key in points) {
            let pt = points[key];
            let dist = Math.hypot(pos.x - pt.x, pos.y - pt.y);
            if (dist < 60) { // รัศมีการกดกว้างถึง 60 พิกเซล จิ้มง่ายแน่นอน
                activePoint = key;
                break;
            }
        }
    }

    function onMove(e) {
        if (!activePoint) return;
        e.preventDefault();
        const pos = getPos(e);
        points[activePoint].x = pos.x;
        points[activePoint].y = pos.y;
        draw();
    }

    function onEnd() {
        activePoint = null;
    }

    // รองรับทั้งเมาส์และนิ้วมือทัชสกรีนแบบเต็มระบบ
    canvas.addEventListener('mousedown', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onEnd);
    
    canvas.addEventListener('touchstart', onStart, { passive: false });
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onEnd);

    opacitySlider.addEventListener('input', draw);

    function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.globalAlpha = parseFloat(opacitySlider.value);

        const { cue, target, pocket } = points;

        // คำนวณ Ghost Ball
        const angleTargetToPocket = Math.atan2(pocket.y - target.y, pocket.x - target.x);
        const ballRadius = 22; 
        
        const ghostX = target.x - Math.cos(angleTargetToPocket) * (ballRadius * 2);
        const ghostY = target.y - Math.sin(angleTargetToPocket) * (ballRadius * 2);

        // 1. เส้นประลูกขาวไปกระทบลูกเป้า (Ghost Ball)
        ctx.beginPath();
        ctx.moveTo(cue.x, cue.y);
        ctx.lineTo(ghostX, ghostY);
        ctx.strokeStyle = '#00f2fe';
        ctx.lineWidth = 4;
        ctx.setLineDash([8, 6]);
        ctx.stroke();

        // 2. เส้นยาวพุ่งทะลุหลุม
        const longDist = 3000;
        const lineEndX = target.x + Math.cos(angleTargetToPocket) * longDist;
        const lineEndY = target.y + Math.sin(angleTargetToPocket) * longDist;

        ctx.beginPath();
        ctx.moveTo(target.x, target.y);
        ctx.lineTo(lineEndX, lineEndY);
        ctx.strokeStyle = '#39ff14';
        ctx.lineWidth = 5;
        ctx.setLineDash([]);
        ctx.stroke();

        // 3. วงกลม Ghost Ball
        ctx.beginPath();
        ctx.arc(ghostX, ghostY, ballRadius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.stroke();

        // 4. วาดปุ่มวงกลมควบคุม (ทำปุ่มให้ใหญ่สะใจ จิ้มลากง่าย)
        for (let key in points) {
            const pt = points[key];
            
            // วงแหวนเรืองแสงรอบนอก
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
            ctx.fillStyle = pt.color;
            ctx.shadowColor = pt.color;
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;

            // ขอบนอกสีดำตัดขอบให้ชัดเจน
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#000000';
            ctx.stroke();

            // ตัวหนังสือบอกชื่อ
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(pt.label, pt.x, pt.y - pt.radius - 8);
        }
    }

    function resetPoints() {
        points.cue = { x: width * 0.3, y: height * 0.6, radius: 35, color: '#ffffff', label: 'ลูกขาว' };
        points.target = { x: width * 0.6, y: height * 0.4, radius: 35, color: '#ff4d4d', label: 'ลูกเป้า' };
        points.pocket = { x: width * 0.85, y: height * 0.2, radius: 35, color: '#ffcc00', label: 'หลุม' };
        draw();
    }

    draw();
</script>
</body>
</html>
